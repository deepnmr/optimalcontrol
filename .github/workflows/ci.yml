name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install stable Rust, Clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,mcp]"
      - name: Ruff
        run: ruff check optimalcontrol/ tests/ examples/ benchmarks/
      - name: Ruff format
        run: ruff format --check optimalcontrol/ tests/ examples/ benchmarks/
      - name: Mypy
        run: mypy optimalcontrol
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Cargo fmt
        run: cargo fmt --check
      - name: Pip check
        run: python -m pip check
      - name: Native tests
        run: python -m pytest -q

  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,mcp]"
      - name: NumPy fallback tests
        env:
          OPTIMALCONTROL_DISABLE_RUST: "1"
        run: python -m pytest -q --deselect tests/test_rust_accelerator.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build sdist
        run: maturin sdist -o dist
      - name: Build wheel
        run: maturin build --release -i python -o dist
      - name: Install wheel
        run: python -m pip install dist/*.whl --force-reinstall
      - name: Import smoke test
        run: python -c "import optimalcontrol; print(optimalcontrol.__version__)"
      - name: Sdist leak check
        run: '! tar tzf dist/*.tar.gz | grep -E "(\.kbsi/|\.github/|CLAUDE\.md|AGENTS\.md|\.claude-plugin/|\.gitignore|benchmarks/)"'
